name: HTML Editor checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check embedded JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test local offline editor
        run: node scripts/browser-test.cjs
      - name: Package standalone HTML files
        uses: actions/upload-artifact@v4
        with:
          name: visual-html-editor
          path: |
            index.html
            demo.html
            README.md
